apiVersion: karpenter.sh/v1
kind: NodePool
metadata:
  name: meeting-bots
spec:
  template:
    metadata:
      labels:
        workload: meeting-bot
    spec:
      nodeClassRef:
        group: karpenter.k8s.aws
        kind: EC2NodeClass
        name: meeting-bots
      taints:
        - key: workload
          value: meeting-bot
          effect: NoSchedule
      requirements:
        - key: kubernetes.io/arch
          operator: In
          values: [amd64]
        - key: kubernetes.io/os
          operator: In
          values: [linux]
        - key: karpenter.sh/capacity-type
          operator: In
          values: [on-demand]
        - key: karpenter.k8s.aws/instance-family
          operator: In
          values: [t3a]
        - key: karpenter.k8s.aws/instance-size
          operator: In
          values: [large]
  limits:
    cpu: {{ .Values.maxCPU | quote }}
    memory: 32Gi
  disruption:
    consolidationPolicy: WhenEmpty
    consolidateAfter: 5m
    budgets:
      - nodes: "1"
