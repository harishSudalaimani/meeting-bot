apiVersion: apps/v1
kind: Deployment
metadata:
  name: bot-controller
  labels: { app.kubernetes.io/name: bot-controller }
spec:
  replicas: {{ .Values.edge.controllerReplicas }}
  selector:
    matchLabels: { app.kubernetes.io/name: bot-controller }
  template:
    metadata:
      labels: { app.kubernetes.io/name: bot-controller }
    spec:
      serviceAccountName: controller
      nodeSelector: { workload: platform }
      securityContext:
        runAsNonRoot: true
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: controller
          image: {{ .Values.images.controller | quote }}
          imagePullPolicy: IfNotPresent
          envFrom: [{ configMapRef: { name: meeting-bot-config } }]
          env:
            - name: MEETING_BOT_IMAGE
              value: {{ .Values.images.meetingBot | quote }}
            - name: OTEL_SERVICE_NAME
              value: bot-controller
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: http://otel-collector.observability.svc.cluster.local:4318
          resources:
            requests: { cpu: 200m, memory: 256Mi }
            limits: { cpu: 750m, memory: 768Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
