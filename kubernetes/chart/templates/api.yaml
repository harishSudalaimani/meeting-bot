apiVersion: apps/v1
kind: Deployment
metadata:
  name: bot-api
  labels: { app.kubernetes.io/name: bot-api }
spec:
  replicas: {{ .Values.edge.apiReplicas }}
  selector:
    matchLabels: { app.kubernetes.io/name: bot-api }
  template:
    metadata:
      labels: { app.kubernetes.io/name: bot-api }
    spec:
      serviceAccountName: api
      nodeSelector: { workload: platform }
      securityContext:
        runAsNonRoot: true
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: api
          image: {{ .Values.images.api | quote }}
          imagePullPolicy: IfNotPresent
          ports: [{ name: https, containerPort: 8443 }]
          envFrom: [{ configMapRef: { name: meeting-bot-config } }]
          env:
            - name: API_BEARER_TOKEN
              valueFrom: { secretKeyRef: { name: meeting-bot-api-auth, key: token } }
            - name: TLS_CERT_FILE
              value: /etc/bot-api/tls.crt
            - name: TLS_KEY_FILE
              value: /etc/bot-api/tls.key
            - name: OTEL_SERVICE_NAME
              value: bot-api
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: http://otel-collector.observability.svc.cluster.local:4318
          volumeMounts:
            - name: tls
              mountPath: /etc/bot-api
              readOnly: true
          readinessProbe:
            httpGet: { path: /healthz, port: https, scheme: HTTPS }
          livenessProbe:
            httpGet: { path: /healthz, port: https, scheme: HTTPS }
          resources:
            requests: { cpu: 100m, memory: 128Mi }
            limits: { cpu: 500m, memory: 512Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
      volumes:
        - name: tls
          secret: { secretName: bot-api-backend-tls }
---
apiVersion: v1
kind: Service
metadata:
  name: bot-api
spec:
  type: ClusterIP
  selector: { app.kubernetes.io/name: bot-api }
  ports:
    - name: https
      port: 8443
      targetPort: https
      protocol: TCP
