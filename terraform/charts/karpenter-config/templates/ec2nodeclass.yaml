apiVersion: karpenter.k8s.aws/v1
kind: EC2NodeClass
metadata:
  name: meeting-bots
spec:
  amiFamily: AL2023
  role: {{ .Values.nodeRoleName | quote }}
  subnetSelectorTerms:
    - tags:
        karpenter.sh/discovery: {{ .Values.clusterName | quote }}
        kubernetes.io/role/internal-elb: "1"
  securityGroupSelectorTerms:
    - tags:
        karpenter.sh/discovery: {{ .Values.clusterName | quote }}
  amiSelectorTerms:
    - alias: {{ .Values.amiAlias | quote }}
  blockDeviceMappings:
    - deviceName: /dev/xvda
      ebs:
        volumeSize: 30Gi
        volumeType: gp3
        encrypted: true
        deleteOnTermination: true
  metadataOptions:
    httpEndpoint: enabled
    httpProtocolIPv6: disabled
    httpPutResponseHopLimit: 1
    httpTokens: required
  tags:
    karpenter.sh/discovery: {{ .Values.clusterName | quote }}
{{ range $key, $value := .Values.commonTags }}
    {{ $key | quote }}: {{ $value | quote }}
{{ end }}
