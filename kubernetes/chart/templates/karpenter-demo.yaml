apiVersion: v1
kind: Pod
metadata:
  name: karpenter-demo
  namespace: meeting-bot
  labels:
    app.kubernetes.io/name: karpenter-demo
    app.kubernetes.io/managed-by: argocd
spec:
  automountServiceAccountToken: false
  nodeSelector:
    workload: meeting-bot
  tolerations:
    - key: workload
      operator: Equal
      value: meeting-bot
      effect: NoSchedule
  containers:
    - name: pause
      image: registry.k8s.io/pause:3.10
      resources:
        requests:
          cpu: 100m
          memory: 128Mi
      securityContext:
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        runAsNonRoot: true
        runAsUser: 65532
        capabilities:
          drop: ["ALL"]
        seccompProfile:
          type: RuntimeDefault
